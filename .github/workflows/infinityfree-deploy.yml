name: Deploy InfinityFree landing page

on:
  push:
    branches: ["main"]
    paths:
      - "infinityfree/**"
      - ".github/workflows/infinityfree-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check FTP secrets exist
        id: check
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          if [[ -n "$FTP_SERVER" && -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "## InfinityFree deployment preflight"
              echo ""
              echo "Required GitHub Actions secrets were detected. The encrypted FTPS upload job will attempt deployment."
              echo ""
              echo "Check the actual upload job result; this preflight alone does not prove the landing page was updated."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "InfinityFree FTP secrets are available."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## InfinityFree landing page upload not run"
              echo ""
              echo "The upload job was skipped because one or more required repository secrets are missing:"
              echo ""
              echo "- INFINITYFREE_FTP_SERVER"
              echo "- INFINITYFREE_FTP_USERNAME"
              echo "- INFINITYFREE_FTP_PASSWORD"
              echo ""
              echo "Add the values in GitHub repository Settings -> Secrets and variables -> Actions. Never put the FTP password in source code, workflow logs, issues, or chat."
              echo ""
              echo "After saving the secrets, open Actions -> Deploy InfinityFree landing page -> Run workflow."
              echo "A green preflight with a skipped upload job does not mean the landing page was updated."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::INFINITYFREE_FTP_SERVER, INFINITYFREE_FTP_USERNAME ve/veya INFINITYFREE_FTP_PASSWORD GitHub Secrets içinde eksik. Yükleme atlanacak."
          fi

  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Upload static landing page to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          # Explicit FTPS encrypts the FTP control and data channel.
          protocol: ftps
          port: 21
          security: strict
          local-dir: infinityfree/
          server-dir: /htdocs/
          dangerous-clean-slate: false
