name: Kaggle Scientific Training and Hugging Face Release

on:
  workflow_call:
    inputs:
      kaggle_kernel_id:
        description: "Optional Kaggle notebook ID (owner/slug)"
        required: false
        type: string
        default: ""
      publish_qwen_adapter:
        description: "Publish the evaluated Qwen LoRA adapter to Hugging Face"
        required: false
        type: boolean
        default: true
      hf_model_repo:
        description: "Hugging Face repo ID (owner/model-name)"
        required: false
        type: string
        default: "hasankb00/dijital-ikiz-qwen3-4b-lora"
      accelerator:
        description: "Kaggle GPU accelerator"
        required: false
        type: string
        default: "NvidiaTeslaT4"
  workflow_dispatch:
    inputs:
      kaggle_kernel_id:
        description: "Optional Kaggle notebook ID (owner/slug); defaults to the authenticated Kaggle account"
        required: false
        type: string
        default: ""
      publish_qwen_adapter:
        description: "Publish the evaluated Qwen LoRA adapter to a private Hugging Face model repo"
        required: true
        type: boolean
        default: true
      hf_model_repo:
        description: "Hugging Face repo ID (owner/model-name); required only when publishing"
        required: false
        type: string
        default: "hasankb00/dijital-ikiz-qwen3-4b-lora"
      accelerator:
        description: "Kaggle GPU accelerator"
        required: true
        type: choice
        default: NvidiaTeslaT4
        options:
          - NvidiaTeslaT4
          - NvidiaL4

permissions:
  contents: read

concurrency:
  group: kaggle-digital-twin-training
  cancel-in-progress: false

jobs:
  train:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KULLANABILEGIN_TOKEN || secrets.KAGGLE_KULLANABILECEGIN_TOKEN || secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      INPUT_ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Kaggle CLI and account identity helper
        run: python -m pip install --disable-pip-version-check --upgrade "kaggle>=2.2.4,<3" "kagglehub>=0.3.12,<1"

      - name: Validate safe inputs and credentials
        env:
          INPUT_KERNEL_ID: ${{ inputs.kaggle_kernel_id || vars.KAGGLE_KERNEL_ID || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]] && { [[ -z "${KAGGLE_USERNAME:-}" ]] || [[ -z "${KAGGLE_KEY:-}" ]]; }; then
            echo "::error::Add KAGGLE_API_TOKEN (preferred) or KAGGLE_USERNAME + KAGGLE_KEY in GitHub Actions Secrets."
            exit 1
          fi

          python - <<'PY'
          import contextlib
          import io
          import os
          import re

          api_token = os.environ.get("KAGGLE_API_TOKEN", "").strip()
          configured_username = os.environ.get("KAGGLE_USERNAME", "").strip()

          if api_token:
              from kagglehub.auth import whoami
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  identity = whoami(verbose=False)
              username = str(identity.get("username", "")).strip()
          else:
              username = configured_username

          if not username:
              raise SystemExit("Kaggle authentication succeeded without a usable account username.")

          requested = os.environ.get("INPUT_KERNEL_ID", "").strip()
          kernel_id = requested or f"{username}/dijital-ikiz-training"
          if not re.fullmatch(r"[A-Za-z0-9_-]+/[A-Za-z0-9_-]+", kernel_id):
              raise SystemExit("Kaggle notebook ID must have the form owner/slug.")

          owner, _slug = kernel_id.split("/", 1)
          if owner.casefold() != username.casefold():
              raise SystemExit("Kaggle notebook owner does not match the authenticated account; refusing to push to another account.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"KERNEL_ID={kernel_id}\n")
              output.write(f"KAGGLE_USERNAME={username}\n")
          print("Kaggle credentials and notebook ownership validated; secret values were not printed.")

      - name: Validate notebook structure and Python cells
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ml/kaggle/dijital_ikiz_training.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          if notebook.get("nbformat") != 4 or not notebook.get("cells"):
              raise SystemExit("Training notebook must be a non-empty nbformat 4 notebook.")
          code_cells = 0
          python_cells = 0
          for index, cell in enumerate(notebook["cells"]):
              if cell.get("cell_type") != "code":
                  continue
              code_cells += 1
              source = "".join(cell.get("source", []))
              lines = source.splitlines()
              magics = [line for line in lines if line.lstrip().startswith(("%", "!"))]
              if magics:
                  if len(lines) == 1 and lines[0].lstrip().startswith("%pip "):
                      continue
                  raise SystemExit(f"Unsupported notebook magic in code cell {index}; static Python validation cannot safely skip it.")
              compile(source, f"{path}:cell-{index}", "exec")
              python_cells += 1
          if code_cells < 5 or python_cells < 5:
              raise SystemExit(f"Unexpectedly few Python code cells: {code_cells}")
          workflow = Path("../../.github/workflows/kaggle-sentiment-pilot.yml").read_text(encoding="utf-8")
          parts = workflow.split("- name: Submit notebook and start Kaggle training", 1)
          if len(parts) != 2:
              raise SystemExit("Workflow is missing its Kaggle submit/run step.")
          submit_step = parts[1].split("\\n      - name:", 1)[0]
          if "kaggle kernels push" not in submit_step or "--no-run" in submit_step:
              raise SystemExit("Kaggle submit step must push the notebook without disabling execution.")
          if "kaggle kernels status" not in workflow or "kaggle kernels output" not in workflow:
              raise SystemExit("Workflow must poll Kaggle status and collect the completed output.")
          print(f"Notebook JSON validated; compiled {python_cells} Python cells and verified autonomous CLI commands.")
          PY

      - name: Prepare Kaggle notebook metadata
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          kernel_id = os.environ["KERNEL_ID"]
          kernel_dir = Path("ml/kaggle")
          notebook = kernel_dir / "dijital_ikiz_training.ipynb"
          if not notebook.is_file():
              raise SystemExit(f"Training notebook missing: {notebook}")

          notebook_doc = json.loads(notebook.read_text(encoding="utf-8"))
          if not any(
              "DIGITAL_TWIN_SOURCE_COMMIT" in "".join(cell.get("source", []))
              for cell in notebook_doc.get("cells", [])
          ):
              injected = "\n".join([
                  "import os as _digital_twin_os",
                  f"_digital_twin_os.environ['DIGITAL_TWIN_SOURCE_COMMIT'] = {json.dumps(os.environ.get('GITHUB_SHA', ''))}",
                  f"_digital_twin_os.environ['DIGITAL_TWIN_GITHUB_RUN_ID'] = {json.dumps(os.environ.get('GITHUB_RUN_ID', ''))}",
                  f"_digital_twin_os.environ['DIGITAL_TWIN_KAGGLE_KERNEL_ID'] = {json.dumps(kernel_id)}",
              ]) + "\n"
              first_code = next(
                  (i for i, cell in enumerate(notebook_doc.get("cells", [])) if cell.get("cell_type") == "code"),
                  len(notebook_doc.get("cells", [])),
              )
              notebook_doc.setdefault("cells", []).insert(first_code, {
                  "cell_type": "code",
                  "execution_count": None,
                  "metadata": {"tags": ["workflow-injected-provenance"]},
                  "outputs": [],
                  "source": injected.splitlines(keepends=True),
              })
              notebook.write_text(
                  json.dumps(notebook_doc, ensure_ascii=False, indent=1) + "\n",
                  encoding="utf-8",
              )

          metadata = {
              "id": kernel_id,
              "title": "Dijital Ikiz Training",
              "code_file": notebook.name,
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": os.environ.get("INPUT_ACCELERATOR", "NvidiaTeslaT4"),
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          (kernel_dir / "kernel-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Prepared private Kaggle notebook metadata with GPU and Internet enabled.")
          PY

      - name: Verify Hugging Face publishing credential before GPU training
        if: ${{ inputs.publish_qwen_adapter || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-model]')) }}
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_WRITE_TOKEN:-}" ]]; then
            echo "::error::HF_WRITE_TOKEN is missing. Add a repo-scoped write token for the private Hugging Face model before spending Kaggle GPU time."
            exit 1
          fi
          echo "Hugging Face model-write credential is present (value redacted)."

      - name: Submit notebook and start Kaggle training
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
        run: |
          set -euo pipefail
          kaggle kernels push --path ml/kaggle --accelerator "$INPUT_ACCELERATOR" --timeout 14400

      - name: Wait for Kaggle training
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=240
          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            status_output="$(kaggle kernels status "$KERNEL_ID" 2>&1)"
            status_code=$?
            set -e
            normalized="$(printf '%s' "$status_output" | tr '[:upper:]' '[:lower:]')"

            if [[ "$normalized" == *"kernelworkerstatus.complete"* ]] || [[ "$normalized" =~ (^|[^a-z])complete([^a-z]|$) ]]; then
              echo "Kaggle reported successful completion."
              exit 0
            fi
            if [[ "$normalized" == *"kernelworkerstatus.error"* || "$normalized" == *"failed"* || "$normalized" == *"cancelled"* || "$normalized" == *"canceled"* || "$normalized" == *"aborted"* ]]; then
              echo "::error::Kaggle training finished with a failure status."
              printf '%s\n' "$status_output"
              exit 1
            fi
            if [[ "$status_code" -ne 0 && "$attempt" -ge 5 ]]; then
              echo "::error::Kaggle status could not be read after repeated attempts."
              printf '%s\n' "$status_output"
              exit 1
            fi
            if (( attempt % 5 == 0 )); then
              echo "Kaggle training is still pending/running (check $attempt of $max_attempts)."
            fi
            sleep 60
          done
          echo "::error::Kaggle training did not finish within the 4-hour polling window."
          exit 1

      - name: Download and validate model artifacts
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kaggle-output/unpacked"
          kaggle kernels output "$KERNEL_ID" --path "$GITHUB_WORKSPACE/kaggle-output" --force
          archive="$GITHUB_WORKSPACE/kaggle-output/dijital-ikiz-model-artifacts.zip"
          if [[ ! -s "$archive" ]]; then
            echo "::error::The expected model archive was not returned by Kaggle."
            find "$GITHUB_WORKSPACE/kaggle-output" -maxdepth 4 -type f -printf '%P (%s bytes)\n' || true
            for log_file in "$GITHUB_WORKSPACE/kaggle-output"/*.log; do
              [[ -f "$log_file" ]] || continue
              echo "Sanitized Kaggle log excerpt: $(basename "$log_file")"
              tail -n 350 "$log_file" | sed -E 's/(hf_[A-Za-z0-9]{25,}|kaggle_[A-Za-z0-9]{25,})/[redacted-credential]/g'
            done
            exit 1
          fi
          unzip -t "$archive"
          unzip -q "$archive" -d "$GITHUB_WORKSPACE/kaggle-output/unpacked"
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "kaggle-output" / "unpacked"
          reports = sorted(root.rglob("metrics.json"))
          if not reports:
              raise SystemExit("No metrics.json files found; refusing to publish unvalidated artifacts.")

          summary = {}
          for path in reports:
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Invalid metrics file: {path.name}") from exc
              if not isinstance(value, dict):
                  raise SystemExit(f"Metrics must be a JSON object: {path.name}")
              summary[str(path.relative_to(root))] = value

          # Require the two core models and their real test metrics before publishing any run.
          sentiment_metrics_path = root / "sentiment" / "metrics.json"
          sentiment_model = root / "sentiment" / "model"
          if not sentiment_metrics_path.is_file():
              raise SystemExit("Required sentiment/metrics.json is missing.")
          if not (sentiment_model / "config.json").is_file():
              raise SystemExit("Sentiment model config is missing.")
          if not any((sentiment_model / name).is_file() for name in ("model.safetensors", "pytorch_model.bin")):
              raise SystemExit("Sentiment model weights are missing; refusing to publish.")
          sentiment = json.loads(sentiment_metrics_path.read_text(encoding="utf-8"))
          sentiment_test = sentiment.get("test_metrics")
          if not isinstance(sentiment_test, dict):
              raise SystemExit("Sentiment test metrics are missing.")
          for key in ("accuracy", "f1_macro", "f1_weighted"):
              value = sentiment_test.get(key)
              if not isinstance(value, (int, float)) or not math.isfinite(value):
                  raise SystemExit(f"Sentiment test metric is invalid: {key}")

          qwen_dir = root / "qwen-lora"
          qwen_metrics_path = qwen_dir / "metrics.json"
          qwen_adapter = qwen_dir / "adapter"
          if not qwen_metrics_path.is_file():
              raise SystemExit("Required qwen-lora/metrics.json is missing.")
          if not (qwen_adapter / "adapter_config.json").is_file():
              raise SystemExit("Qwen LoRA adapter_config.json is missing.")
          if not any(path.is_file() for pattern in ("adapter_model.safetensors", "adapter_model.bin") for path in qwen_adapter.glob(pattern)):
              raise SystemExit("Qwen LoRA adapter weights are missing; refusing to publish.")
          qwen = json.loads(qwen_metrics_path.read_text(encoding="utf-8"))
          if qwen.get("base_model") != "Qwen/Qwen3-4B-Instruct-2507":
              raise SystemExit("Qwen metrics identify an unexpected base model.")
          for key in ("base_model_test_loss", "finetuned_model_test_loss", "validation_loss", "test_loss_improvement"):
              value = qwen.get(key)
              if not isinstance(value, (int, float)) or not math.isfinite(value):
                  raise SystemExit(f"Qwen test metric is missing or invalid: {key}")
          for key in ("train_rows_encoded", "validation_rows_encoded", "test_rows_encoded"):
              value = qwen.get(key)
              if not isinstance(value, int) or value <= 0:
                  raise SystemExit(f"Qwen encoded sample count is missing or invalid: {key}")

          aggregate_path = root / "training-metrics.json"
          if not aggregate_path.is_file():
              raise SystemExit("Consolidated training-metrics.json is missing; refusing to publish.")
          aggregate = json.loads(aggregate_path.read_text(encoding="utf-8"))
          if aggregate.get("status") != "completed_metrics_validated":
              raise SystemExit("Consolidated training-metrics.json is not marked validated.")
          task_metrics = aggregate.get("tasks", {})
          if task_metrics.get("sentiment_polarity", {}).get("status") != "evaluated":
              raise SystemExit("Sentiment polarity task is not marked evaluated.")
          if task_metrics.get("qwen_lora", {}).get("base_model") != "Qwen/Qwen3-4B-Instruct-2507":
              raise SystemExit("Consolidated metrics identify an unexpected Qwen base model.")
          if not (root / "scientific-validation-report.md").is_file():
              raise SystemExit("Generated scientific-validation-report.md is missing.")

          output = root.parent / "metrics-summary.json"
          output.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Validated sentiment metrics, Qwen LoRA weights/loss, consolidated metrics, and scientific report.")
          print(f"Validated {len(reports)} metrics report(s).")
          PY

      - name: Upload reproducible training artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kaggle-digital-twin-model-artifacts
          path: |
            kaggle-output/dijital-ikiz-model-artifacts.zip
            kaggle-output/metrics-summary.json
            kaggle-output/unpacked/training-metrics.json
            kaggle-output/unpacked/scientific-validation-report.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish Qwen LoRA adapter through the validated publisher
        if: ${{ inputs.publish_qwen_adapter || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-model]')) }}
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          HF_MODEL_REPO: ${{ inputs.hf_model_repo || vars.HF_MODEL_REPO || 'hasankb00/dijital-ikiz-qwen3-4b-lora' }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_WRITE_TOKEN:-}" ]]; then
            echo "::error::Publishing requires the HF_WRITE_TOKEN GitHub secret with write permission to the target private model repo."
            exit 1
          fi
          if [[ ! "$HF_MODEL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Hugging Face model repo must use OWNER/REPO form."
            exit 1
          fi

          python -m pip install --disable-pip-version-check "huggingface_hub>=0.34,<2"
          archive="$GITHUB_WORKSPACE/kaggle-output/dijital-ikiz-model-artifacts.zip"
          source_digest="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          python ml/kaggle/publish_lora_to_hf.py \
            --artifact-dir "$GITHUB_WORKSPACE/kaggle-output" \
            --repo-id "$HF_MODEL_REPO" \
            --run-id "$SOURCE_RUN_ID" \
            --source-artifact-digest "$source_digest" \
            | tee "$RUNNER_TEMP/hf-publish-result.json"

          {
            echo "## Private Hugging Face LoRA publication"
            echo ""
            cat "$RUNNER_TEMP/hf-publish-result.json"
          } >> "$GITHUB_STEP_SUMMARY"
