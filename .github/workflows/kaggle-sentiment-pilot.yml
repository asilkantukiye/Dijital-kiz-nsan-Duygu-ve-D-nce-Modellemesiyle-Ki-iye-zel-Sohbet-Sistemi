name: Run Kaggle sentiment pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle-sentiment-pilot.yml"
      - "dijital-ikiz-mvp/dijital-ikiz-mvp/ml/kaggle/sentiment_baseline.ipynb"
  workflow_dispatch:
    inputs:
      accelerator:
        description: "Kaggle GPU accelerator"
        required: true
        type: choice
        default: NvidiaTeslaT4
        options:
          - NvidiaTeslaT4
          - NvidiaL4

permissions:
  contents: read

concurrency:
  group: kaggle-sentiment-pilot
  cancel-in-progress: false

jobs:
  train:
    name: Train Turkish sentiment baseline on Kaggle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KULLANABILEGIN_TOKEN || secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      INPUT_ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Kaggle credentials
        shell: bash
        run: |
          if [[ -z "${KAGGLE_API_TOKEN:-}" && ( -z "${KAGGLE_KEY:-}" || -z "${KAGGLE_USERNAME:-}" ) ]]; then
            echo "::error::Add KAGGLE_API_TOKEN or KAGGLE_KULLANABILEGIN_TOKEN. For legacy KAGGLE_KEY auth, KAGGLE_USERNAME is also required. Never put credentials in code or logs."
            exit 1
          fi
          echo "A supported Kaggle credential source is configured; secret values are not printed."

      - name: Install Kaggle CLI and account lookup
        run: python -m pip install --upgrade "kaggle>=2.2.4,<3" "kagglehub>=0.3.12,<1"

      - name: Resolve Kaggle account username
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KAGGLE_API_TOKEN:-}" ]]; then
            username="$(python - <<'PY'
          import contextlib
          import io
          from kagglehub.auth import whoami
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              identity = whoami(verbose=False)
          print(identity["username"])
          PY
          )"
            if [[ -z "$username" ]]; then
              echo "::error::Kaggle token authentication succeeded without returning an account username."
              exit 1
            fi
            echo "Kaggle account identity verified (username is not printed)."
            echo "KAGGLE_USERNAME=$username" >> "$GITHUB_ENV"
          elif [[ -z "${KAGGLE_USERNAME:-}" ]]; then
            echo "::error::KAGGLE_USERNAME is required for legacy KAGGLE_KEY auth."
            exit 1
          fi

      - name: Prepare private Kaggle notebook
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/kaggle-sentiment-pilot"
          mkdir -p "$RUN_DIR"
          cp dijital-ikiz-mvp/dijital-ikiz-mvp/ml/kaggle/sentiment_baseline.ipynb "$RUN_DIR/sentiment_baseline.ipynb"
          cat > "$RUN_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KAGGLE_USERNAME}/dijital-ikiz-sentiment-pilot",
            "title": "Dijital Ikiz Sentiment Pilot",
            "code_file": "sentiment_baseline.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": "true",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "${INPUT_ACCELERATOR}",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          echo "KAGGLE_KERNEL_ID=${KAGGLE_USERNAME}/dijital-ikiz-sentiment-pilot" >> "$GITHUB_ENV"
          echo "KAGGLE_RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "Kaggle notebook metadata prepared for selected accelerator."

      - name: Submit notebook to Kaggle
        run: kaggle kernels push -p "$KAGGLE_RUN_DIR" --timeout 2400 --accelerator "$INPUT_ACCELERATOR"

      - name: Wait for Kaggle training
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2550))
          completed=0
          while (( SECONDS < deadline )); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_ID" 2>&1 || true)"
            printf '%s\n' "$status"
            lower_status="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"

            if grep -Eqi '(^|[^[:alpha:]])(failed|error)([^[:alpha:]]|$)' <<< "$lower_status"; then
              echo "::error::Kaggle training reported an error. Open the Kaggle notebook logs to inspect the failure."
              kaggle kernels logs "$KAGGLE_KERNEL_ID" 2>&1 | tail -n 250 || true
              exit 1
            fi

            if grep -Eqi '(^|[^[:alpha:]])(complete|completed|success|succeeded)([^[:alpha:]]|$)' <<< "$lower_status"; then
              completed=1
              break
            fi

            sleep 30
          done

          if [[ "$completed" != "1" ]]; then
            echo "::error::Kaggle training did not finish within the workflow wait window. Check the Kaggle notebook status and logs."
            kaggle kernels logs "$KAGGLE_KERNEL_ID" || true
            exit 1
          fi

      - name: Download model and metrics from Kaggle
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/kaggle-sentiment-output"
          ARTIFACT_DIR="$RUNNER_TEMP/kaggle-sentiment-artifact"
          mkdir -p "$OUT_DIR" "$ARTIFACT_DIR"
          kaggle kernels output "$KAGGLE_KERNEL_ID" --path "$OUT_DIR" --force

          zip_path="$(find "$OUT_DIR" -type f -name 'dijital-ikiz-sentiment-pilot.zip' -print -quit)"
          if [[ -z "$zip_path" ]]; then
            echo "::error::Expected model ZIP was not returned by Kaggle. The notebook may have failed before artifact creation."
            find "$OUT_DIR" -maxdepth 3 -type f -print
            exit 1
          fi

          cp "$zip_path" "$ARTIFACT_DIR/dijital-ikiz-sentiment-pilot.zip"
          unzip -p "$zip_path" 'sentiment/metrics.json' > "$ARTIFACT_DIR/metrics.json"
          echo "Kaggle model archive and test metrics downloaded."

          {
            echo "## Turkish sentiment pilot result"
            echo
            echo "This artifact was created by a real Kaggle run. Read the limitations in metrics.json; this sentiment-polarity experiment is not a VAD or Big Five validation."
            echo
            echo "### Test metrics"
            cat "$ARTIFACT_DIR/metrics.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v7
        with:
          name: kaggle-sentiment-pilot-results
          path: |
            ${{ runner.temp }}/kaggle-sentiment-artifact/dijital-ikiz-sentiment-pilot.zip
            ${{ runner.temp }}/kaggle-sentiment-artifact/metrics.json
          if-no-files-found: error
          retention-days: 14
