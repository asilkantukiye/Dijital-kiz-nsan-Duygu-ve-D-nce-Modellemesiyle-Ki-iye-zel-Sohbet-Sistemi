name: Run Kaggle sentiment pilot

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: "Kaggle GPU accelerator"
        required: true
        type: choice
        default: NvidiaTeslaT4
        options:
          - NvidiaTeslaT4
          - NvidiaL4

permissions:
  contents: read

concurrency:
  group: kaggle-sentiment-pilot
  cancel-in-progress: false

jobs:
  train:
    name: Train Turkish sentiment baseline on Kaggle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KULLANABILEGIN_TOKEN || secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      INPUT_ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Kaggle credentials
        shell: bash
        run: |
          if [[ -z "${KAGGLE_API_TOKEN:-}" && ( -z "${KAGGLE_KEY:-}" || -z "${KAGGLE_USERNAME:-}" ) ]]; then
            echo "::error::Add KAGGLE_API_TOKEN or KAGGLE_KULLANABILEGIN_TOKEN. For legacy KAGGLE_KEY auth, KAGGLE_USERNAME is also required. Never put credentials in code or logs."
            exit 1
          fi
          echo "A supported Kaggle credential source is configured; secret values are not printed."

      - name: Install Kaggle CLI and account lookup
        run: python -m pip install --upgrade "kaggle>=2.2.4,<3" "kagglehub>=0.3.12,<1"

      - name: Resolve Kaggle account username
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KAGGLE_API_TOKEN:-}" ]]; then
            username="$(python - <<'PY'
          import contextlib
          import io
          from kagglehub.auth import whoami
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              identity = whoami(verbose=False)
          print(identity["username"])
          PY
          )"
            if [[ -z "$username" ]]; then
              echo "::error::Kaggle token authentication succeeded without returning an account username."
              exit 1
            fi
            echo "Kaggle account identity verified (username is not printed)."
            echo "KAGGLE_USERNAME=$username" >> "$GITHUB_ENV"
          elif [[ -z "${KAGGLE_USERNAME:-}" ]]; then
            echo "::error::KAGGLE_USERNAME is required for legacy KAGGLE_KEY auth."
            exit 1
          fi

      - name: Prepare private Kaggle notebook
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/kaggle-sentiment-pilot"
          mkdir -p "$RUN_DIR"
          cp dijital-ikiz-mvp/dijital-ikiz-mvp/ml/kaggle/sentiment_baseline.ipynb "$RUN_DIR/sentiment_baseline.ipynb"
          cat > "$RUN_DIR/kernel-metadata.json" <<EOF
          {
            "id": "${KAGGLE_USERNAME}/dijital-ikiz-sentiment-pilot",
            "title": "Dijital Ikiz Sentiment Pilot",
            "code_file": "sentiment_baseline.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": "true",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "${INPUT_ACCELERATOR}",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          echo "KAGGLE_KERNEL_ID=${KAGGLE_USERNAME}/dijital-ikiz-sentiment-pilot" >> "$GITHUB_ENV"
          echo "KAGGLE_RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "Kaggle notebook metadata prepared for selected accelerator."

      - name: Upload notebook without executing it
        run: kaggle kernels push -p "$KAGGLE_RUN_DIR" --no-run

      - name: Explain Kaggle UI internet requirement
        shell: bash
        run: |
          {
            echo "## Kaggle notebook prepared"
            echo
            echo "The notebook has been uploaded but was not executed from the API. Kaggle API-submitted runs may ignore the metadata internet flag; the observed run could not resolve pypi.org."
            echo
            echo "1. Open the notebook in Kaggle: https://www.kaggle.com/code/${KAGGLE_USERNAME}/dijital-ikiz-sentiment-pilot"
            echo "2. In the right-side Settings/Notebook panel, open Session options and switch Internet on."
            echo "3. Save the setting, then use Run All and wait for the notebook to finish."
            echo "4. After the notebook completes, run the **Download Kaggle sentiment pilot results** workflow to fetch the model ZIP and metrics as a GitHub Actions artifact."
            echo
            echo "No trained model or metrics are claimed by this preparation workflow."
          } >> "$GITHUB_STEP_SUMMARY"
