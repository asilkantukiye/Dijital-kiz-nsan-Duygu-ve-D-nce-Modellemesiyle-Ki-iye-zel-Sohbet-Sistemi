name: Download Kaggle Model Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    name: Fetch completed digital twin models and metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KULLANABILEGIN_TOKEN || secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install current Kaggle CLI
        run: python -m pip install --upgrade "kaggle>=2.2.4,<3" "kagglehub>=0.3.12,<1"

      - name: Resolve Kaggle account username
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KAGGLE_API_TOKEN:-}" ]]; then
            username="$(python - <<'PY'
          import contextlib
          import io
          from kagglehub.auth import whoami
          with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
              identity = whoami(verbose=False)
          print(identity["username"])
          PY
          )"
            echo "Kaggle account identity verified."
            echo "KAGGLE_USERNAME=$username" >> "$GITHUB_ENV"
          elif [[ -z "${KAGGLE_USERNAME:-}" || -z "${KAGGLE_KEY:-}" ]]; then
            echo "::error::Set KAGGLE_API_TOKEN or KAGGLE_KULLANABILEGIN_TOKEN; legacy auth requires KAGGLE_USERNAME and KAGGLE_KEY."
            exit 1
          fi
          echo "KAGGLE_KERNEL_ID=${KAGGLE_USERNAME}/dijital-ikiz-training" >> "$GITHUB_ENV"

      - name: Check Kaggle notebook completion
        shell: bash
        run: |
          set -euo pipefail
          status="$(kaggle kernels status "$KAGGLE_KERNEL_ID" 2>&1 || true)"
          printf '%s\n' "$status"
          lower_status="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
          if grep -Eqi '(^|[^[:alpha:]])(failed|error)([^[:alpha:]]|$)' <<< "$lower_status"; then
            echo "Kaggle reports an error. Recent notebook logs:"
            kaggle kernels logs "$KAGGLE_KERNEL_ID" 2>&1 | tail -n 250 || true
            echo "::error::The Kaggle notebook did not complete successfully. Fix the notebook error before downloading artifacts."
            exit 1
          fi
          if ! grep -Eqi '(^|[^[:alpha:]])(complete|completed|success|succeeded)([^[:alpha:]]|$)' <<< "$lower_status"; then
            echo "::error::The Kaggle notebook has not completed yet. Open it in Kaggle, enable Internet, click Run All, then retry this workflow."
            exit 1
          fi

      - name: Download model package and collect metrics
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/kaggle-model-output"
          ARTIFACT_DIR="$RUNNER_TEMP/kaggle-model-artifact"
          mkdir -p "$OUT_DIR" "$ARTIFACT_DIR"
          kaggle kernels output "$KAGGLE_KERNEL_ID" --path "$OUT_DIR" --force

          zip_path="$(find "$OUT_DIR" -type f -name 'dijital-ikiz-model-artifacts.zip' -print -quit)"
          if [[ -z "$zip_path" ]]; then
            echo "::error::Kaggle output does not contain dijital-ikiz-model-artifacts.zip."
            find "$OUT_DIR" -maxdepth 3 -type f -print
            exit 1
          fi
          cp "$zip_path" "$ARTIFACT_DIR/dijital-ikiz-model-artifacts.zip"
          mkdir -p "$OUT_DIR/extracted"
          unzip -q "$zip_path" -d "$OUT_DIR/extracted"
          python - "$OUT_DIR/extracted" "$ARTIFACT_DIR/metrics-summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          records = {}
          for path in sorted(root.rglob("metrics-summary.json")):
              records[path.relative_to(root).as_posix()] = json.loads(path.read_text(encoding="utf-8"))
          if not records:
              raise SystemExit("The archive contains no metrics-summary.json files.")
          Path(sys.argv[2]).write_text(
              json.dumps(records, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({key: value.get("task", "metrics") for key, value in records.items()}, ensure_ascii=False))
          PY

          {
            echo "## Kaggle model training results"
            echo
            echo "Metrics are read from the completed Kaggle notebook output; each task is reported separately."
            echo
            cat "$ARTIFACT_DIR/metrics-summary.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v7
        with:
          name: kaggle-model-artifacts
          path: |
            ${{ runner.temp }}/kaggle-model-artifact/dijital-ikiz-model-artifacts.zip
            ${{ runner.temp }}/kaggle-model-artifact/metrics-summary.json
          if-no-files-found: error
          retention-days: 14
