name: Capture CI Test Results

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: ci-result-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Collect job and step outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,url,headBranch,headSha,displayTitle,jobs > "$RUNNER_TEMP/ci-run.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ci-run.json', 'utf8'));
          const jobs = (raw.jobs || []).map(job => ({
            name: job.name,
            conclusion: job.conclusion,
            steps: (job.steps || []).map(step => ({
              name: step.name,
              conclusion: step.conclusion
            }))
          }));
          const report = {
            workflow: 'CI',
            run_id: Number(process.env.SOURCE_RUN_ID),
            run_url: process.env.SOURCE_RUN_URL,
            conclusion: process.env.SOURCE_CONCLUSION,
            branch: process.env.SOURCE_BRANCH,
            commit: process.env.SOURCE_SHA,
            jobs,
            secrets_included: false
          };
          fs.mkdirSync(process.env.RUNNER_TEMP + '/ci-results', {recursive: true});
          fs.writeFileSync(process.env.RUNNER_TEMP + '/ci-results/status.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Publish test results to the report branch
        if: always()
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$RUNNER_TEMP/ci-results/status.json" ]]; then
            mkdir -p "$RUNNER_TEMP/ci-results"
            printf '{"workflow":"CI","run_id":%s,"conclusion":"capture_failed","secrets_included":false}\n' "$SOURCE_RUN_ID" > "$RUNNER_TEMP/ci-results/status.json"
          fi
          git fetch origin main
          git switch -C ops/ci-results origin/main
          mkdir -p .github/status
          cp "$RUNNER_TEMP/ci-results/status.json" .github/status/ci-test-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/ci-test-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): record automated validation results"
          git push --force origin HEAD:ops/ci-results
