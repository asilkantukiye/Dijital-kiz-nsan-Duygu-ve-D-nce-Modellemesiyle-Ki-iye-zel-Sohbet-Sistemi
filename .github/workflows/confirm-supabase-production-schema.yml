name: Record verified Production Supabase schema

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/confirm-supabase-production-schema.yml"

permissions:
  contents: read

jobs:
  confirm:
    if: ${{ contains(github.event.head_commit.message, '[supabase-schema-verified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Record live verification and set the repository guard
        env:
          GH_VARIABLES_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/schema-verification"
          report="$RUNNER_TEMP/schema-verification/status.json"
          set_exit=0
          read_exit=0
          value=""
          if [[ -z "${GH_VARIABLES_TOKEN:-}" ]]; then
            set_exit=127
            read_exit=127
            verified="false"
            result="GH_VARIABLES_TOKEN_secret_missing"
            echo "::error::GH_VARIABLES_TOKEN is missing. The default GITHUB_TOKEN cannot manage repository Actions variables."
            {
              echo "## Supabase schema verification recorded; deployment guard unchanged"
              echo ""
              echo "Database checks were performed, but the repository guard was **not** changed."
              echo "Add a repository secret named GH_VARIABLES_TOKEN using a fine-grained token scoped only to this repository with **Variables: read and write** permission, or set SUPABASE_PRODUCTION_SCHEMA_VERIFIED manually in Settings after reviewing the live database evidence."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            GH_TOKEN="$GH_VARIABLES_TOKEN" gh variable set SUPABASE_PRODUCTION_SCHEMA_VERIFIED --body true --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || set_exit=$?
            value="$(GH_TOKEN="$GH_VARIABLES_TOKEN" gh variable list --repo "$GITHUB_REPOSITORY" --json name,value --jq '.[] | select(.name == "SUPABASE_PRODUCTION_SCHEMA_VERIFIED") | .value' 2>/dev/null)" || read_exit=$?
            if [[ "$set_exit" -eq 0 && "$read_exit" -eq 0 && "$value" == "true" ]]; then
              verified="true"
              result="repository_variable_set_and_read_back"
            else
              verified="false"
              result="repository_variable_write_or_readback_failed"
              echo "::error::Could not set and read back SUPABASE_PRODUCTION_SCHEMA_VERIFIED with GH_VARIABLES_TOKEN."
            fi
          fi

          VERIFIED="$verified" RESULT="$result" SET_EXIT="$set_exit" READ_EXIT="$read_exit"             SOURCE_SHA="$SOURCE_SHA" SOURCE_RUN_ID="$SOURCE_RUN_ID" REPORT_PATH="$report" node - <<'NODE'
          const fs = require('node:fs');
          const report = {
            purpose: 'Record the live Supabase Production schema verification performed for this release',
            source_commit: process.env.SOURCE_SHA,
            workflow_run_id: Number(process.env.SOURCE_RUN_ID),
            database_evidence: {
              project_status: 'ACTIVE_HEALTHY',
              applied_migration_records: 22,
              user_data_rls: 'enabled on audited user-scoped tables',
              server_rpc_permissions: 'verified against live function catalog',
              rate_limit_rpc_smoke_test: 'passed in a transaction rolled back after test',
              retention_cleanup_cron: 'active; latest inspected run succeeded'
            },
            repository_variable: {
              name: 'SUPABASE_PRODUCTION_SCHEMA_VERIFIED',
              requested_value: 'true',
              read_back_value_matches: process.env.VERIFIED === 'true',
              write_exit_code: Number(process.env.SET_EXIT),
              read_exit_code: Number(process.env.READ_EXIT),
              result: process.env.RESULT
            },
            secrets_included: false
          };
          fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

          git fetch origin main
          git switch -C ops/supabase-schema-verification origin/main
          mkdir -p .github/status
          cp "$report" .github/status/production-schema-verification.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/production-schema-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(db): record live Production schema verification"
            git push --force origin HEAD:ops/supabase-schema-verification
          fi
          if [[ "$verified" != "true" ]]; then
            echo "::error::Production schema checks may be recorded, but the deployment guard is not verified. Do not deploy until the repository variable is set and read back successfully."
            exit 1
          fi
          echo "Live Supabase schema verification was recorded and read back successfully."
