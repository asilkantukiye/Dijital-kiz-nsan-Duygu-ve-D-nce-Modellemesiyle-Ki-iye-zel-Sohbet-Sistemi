name: Polarity TF-IDF Baseline Benchmark

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/polarity-tfidf-baseline.yml"
      - "dijital-ikiz-mvp/dijital-ikiz-mvp/ml/baselines/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polarity-tfidf-baseline
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned CPU-only benchmark dependencies
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4" "pandas==2.2.3" "scikit-learn==1.6.1"

      - name: Run baseline regression tests
        run: python -m unittest discover -s ml/baselines -p "test_*.py" -v

      - name: Fit TF-IDF + logistic regression on the exact pilot split
        env:
          POLARITY_DATA_DIR: ${{ runner.temp }}/polarity-dataset
          BASELINE_OUTPUT: ${{ runner.temp }}/polarity-tfidf-baseline/metrics.json
        run: |
          set -euo pipefail
          python ml/baselines/run_polarity_baseline.py --output "$BASELINE_OUTPUT"

      - name: Upload baseline metrics
        uses: actions/upload-artifact@v7
        with:
          name: polarity-tfidf-baseline-metrics
          path: ${{ runner.temp }}/polarity-tfidf-baseline/metrics.json
          if-no-files-found: error
          retention-days: 14
