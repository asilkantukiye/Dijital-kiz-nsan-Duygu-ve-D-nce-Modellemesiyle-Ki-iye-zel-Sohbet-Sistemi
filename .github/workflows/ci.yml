name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "fix/aud-03-concurrent-profile-updates", "fix/aud-04-memory-ownership-validation"]
  pull_request:
    branches: ["main", "fix/aud-01-security-hardening", "fix/aud-02-chat-deduplication", "fix/aud-03-concurrent-profile-updates"]

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: digital_twin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_twin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package-lock.json

      - name: Set up Python for notebook validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile ML Python sources
        run: python -m compileall -q ml

      - name: Validate Kaggle notebook syntax
        run: python ml/kaggle/validate_notebook.py

      - name: Validate sentiment baseline notebook syntax
        run: python ml/kaggle/validate_notebook.py ml/kaggle/sentiment_baseline.ipynb

      - name: Validate ML dataset, splits, and leakage guardrails
        run: python -m unittest discover -s ml/tests -p "test_*.py"

      - name: Test atomic chat-turn migration against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: digital_twin_test
        run: |
          psql --version
          psql --set ON_ERROR_STOP=1 \
            --file tests/sql/persist_chat_turn.setup.sql \
            --file supabase/migrations/20261008191854_rls_and_ab_performance_hardening.sql \
            --file supabase/migrations/20261008202104_stage5_memory_engine.sql \
            --file supabase/migrations/20261008202255_stage5_memory_fk_index.sql \
            --file supabase/migrations/20261018190000_atomic_user_data_deletion.sql \
            --file supabase/migrations/20261019175000_feedback_message_ownership_rls.sql \
            --file supabase/migrations/20261020200000_atomic_chat_turn_persistence.sql \
            --file supabase/migrations/20261021210000_stage5_memory_extensions_usage.sql \
            --file supabase/migrations/20261021211000_stage5_atomic_memory_preference_update.sql \
            --file supabase/migrations/20261023196000_aud_01_chat_write_boundary.sql \
            --file supabase/migrations/20261023200000_aud_02_chat_deduplication.sql \
            --file supabase/migrations/20261023210000_aud_03_concurrent_profile_updates.sql \
            --file supabase/migrations/20261023220000_aud_04_memory_ownership_validation.sql \
            --file tests/sql/migration_catalog.integration.sql \
            --file tests/sql/persist_chat_turn.integration.sql \
            --file tests/sql/chat_write_boundary.integration.sql \
            --file tests/sql/chat_idempotency.integration.sql \
            --file tests/sql/memory_rls.integration.sql \
            --file tests/sql/memory_preference_update.integration.sql \
            --file tests/sql/security_rpc.integration.sql \
            --file tests/sql/memory_source_ownership.integration.sql

      - name: Test concurrent profile updates against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: digital_twin_test
        run: node tests/profile-update-concurrency.integration.mjs

      - name: Install
        run: npm ci

      - name: Unit tests (memory and API validation)
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
