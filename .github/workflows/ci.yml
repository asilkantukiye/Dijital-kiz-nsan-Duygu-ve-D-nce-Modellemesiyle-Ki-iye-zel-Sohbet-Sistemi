name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package.json

      - name: Set up Python for notebook validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Kaggle notebook syntax
        run: python ml/kaggle/validate_notebook.py

      - name: Validate sentiment baseline notebook syntax
        run: python ml/kaggle/validate_notebook.py ml/kaggle/sentiment_baseline.ipynb

      - name: Validate ML dataset, splits, and leakage guardrails
        run: python -m unittest discover -s ml/tests -p "test_*.py"

      - name: Install
        run: npm install

      - name: Memory safety tests
        run: npm run test:memory

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
