name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "fix/aud-03-concurrent-profile-updates", "fix/aud-04-memory-ownership-validation", "fix/aud-05-06-full-system-hardening"]
  pull_request:
    branches: ["main", "fix/aud-01-security-hardening", "fix/aud-02-chat-deduplication", "fix/aud-03-concurrent-profile-updates", "fix/aud-04-memory-ownership-validation"]

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: digital_twin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_twin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package-lock.json

      - name: Set up Python for notebook validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile ML Python sources
        run: python -m compileall -q ml

      - name: Validate Kaggle notebook syntax
        run: python ml/kaggle/validate_notebook.py

      - name: Validate ML dataset, splits, and leakage guardrails
        run: python -m unittest discover -s ml/tests -p "test_*.py"

      - name: Test atomic chat-turn migration against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: digital_twin_test
        run: |
          psql --version
          psql --set ON_ERROR_STOP=1 \
            --file tests/sql/persist_chat_turn.setup.sql \
            --file supabase/migrations/20261008191854_rls_and_ab_performance_hardening.sql \
            --file supabase/migrations/20261008202104_stage5_memory_engine.sql \
            --file supabase/migrations/20261008202255_stage5_memory_fk_index.sql \
            --file supabase/migrations/20261018190000_atomic_user_data_deletion.sql \
            --file supabase/migrations/20261019175000_feedback_message_ownership_rls.sql \
            --file supabase/migrations/20261020200000_atomic_chat_turn_persistence.sql \
            --file supabase/migrations/20261021210000_stage5_memory_extensions_usage.sql \
            --file supabase/migrations/20261021211000_stage5_atomic_memory_preference_update.sql \
            --file supabase/migrations/20261023196000_aud_01_chat_write_boundary.sql \
            --file supabase/migrations/20261023200000_aud_02_chat_deduplication.sql \
            --file supabase/migrations/20261023210000_aud_03_concurrent_profile_updates.sql \
            --file supabase/migrations/20261023220000_aud_04_memory_ownership_validation.sql \
            --file supabase/migrations/20261023230000_aud_05_embedding_validation.sql \
            --file supabase/migrations/20261023230500_aud_05_validate_embedding_integrity.sql \
            --file supabase/migrations/20261023231000_aud_06_chat_deduplication_window.sql \
            --file supabase/migrations/20261025170000_stage6_foreign_key_indexes.sql \
            --file supabase/migrations/20261027171525_supabase_backed_chat_rate_limit.sql \
            --file supabase/migrations/20261027181135_stage6_180_day_retention_cleanup.sql \
            --file supabase/migrations/20261027181851_stage6_retention_inactivity_semantics.sql \
            --file supabase/migrations/20261027182055_stage6_retention_index_cleanup.sql \
            --file supabase/migrations/20261027200000_delete_my_chat_inflight_claims.sql \
            --file tests/sql/migration_catalog.integration.sql \
            --file tests/sql/chat_rate_limit.integration.sql \
            --file tests/sql/persist_chat_turn.integration.sql \
            --file tests/sql/chat_write_boundary.integration.sql \
            --file tests/sql/chat_idempotency.integration.sql \
            --file tests/sql/memory_rls.integration.sql \
            --file tests/sql/memory_preference_update.integration.sql \
            --file tests/sql/security_rpc.integration.sql \
            --file tests/sql/data_deletion_idempotency.integration.sql \
            --file tests/sql/memory_source_ownership.integration.sql \
            --file tests/sql/memory_embedding_integrity.integration.sql \
            --file tests/sql/retention_cleanup.integration.sql

      - name: Test embedding integrity against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: digital_twin_test
        run: psql --set ON_ERROR_STOP=1 --file tests/sql/memory_embedding_integrity.integration.sql
      - name: Test concurrent profile updates against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: digital_twin_test
        run: node tests/profile-update-concurrency.integration.mjs

      - name: Stress concurrent rate-limit requests against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: digital_twin_test
        run: node tests/chat-rate-limit-concurrency.integration.mjs

      - name: Install
        run: npm ci

      - name: Unit tests (memory and API validation)
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build


  report:
    name: Record automated validation results
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: [web]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Capture test, typecheck and build outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ needs.web.result }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,url,headBranch,headSha,displayTitle,jobs > "$RUNNER_TEMP/ci-run.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ci-run.json', 'utf8'));
          const jobs = (raw.jobs || []).map(job => ({
            name: job.name,
            conclusion: job.conclusion,
            steps: (job.steps || []).map(step => ({
              name: step.name,
              conclusion: step.conclusion
            }))
          }));
          const report = {
            workflow: 'CI',
            run_id: Number(process.env.SOURCE_RUN_ID),
            run_url: process.env.SOURCE_RUN_URL,
            branch: process.env.SOURCE_BRANCH,
            commit: process.env.SOURCE_SHA,
            conclusion: process.env.CI_RESULT,
            jobs,
            secrets_included: false
          };
          fs.mkdirSync(process.env.RUNNER_TEMP + '/ci-result-report', {recursive: true});
          fs.writeFileSync(process.env.RUNNER_TEMP + '/ci-result-report/status.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Publish results to the CI report branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$RUNNER_TEMP/ci-result-report/status.json" ]]; then
            mkdir -p "$RUNNER_TEMP/ci-result-report"
            printf '{"workflow":"CI","run_id":%s,"conclusion":"capture_failed","secrets_included":false}\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-result-report/status.json"
          fi
          git fetch origin main
          git switch -C ops/ci-results origin/main
          mkdir -p .github/status
          cp "$RUNNER_TEMP/ci-result-report/status.json" .github/status/ci-test-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/ci-test-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): record automated validation evidence"
          git push --force origin HEAD:ops/ci-results
