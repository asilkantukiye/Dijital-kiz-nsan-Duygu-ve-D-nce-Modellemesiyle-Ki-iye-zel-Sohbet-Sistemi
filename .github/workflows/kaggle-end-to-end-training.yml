name: Trigger Kaggle End-to-End Model Training

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/kaggle-end-to-end-training.yml"
      - ".github/workflows/kaggle-sentiment-pilot.yml"
      - "dijital-ikiz-mvp/dijital-ikiz-mvp/ml/kaggle/**"
  workflow_dispatch:
    inputs:
      kaggle_kernel_id:
        description: "Optional Kaggle notebook ID (owner/slug); defaults to the authenticated account"
        required: false
        type: string
        default: ""
      publish_qwen_adapter:
        description: "Publish the evaluated Qwen LoRA adapter to the private Hugging Face model repository"
        required: true
        type: boolean
        default: true
      hf_model_repo:
        description: "Hugging Face repo ID (owner/model-name)"
        required: false
        type: string
        default: "hasankb00/dijital-ikiz-qwen3-4b-lora"
      accelerator:
        description: "Kaggle GPU accelerator"
        required: true
        type: choice
        default: NvidiaTeslaT4
        options:
          - NvidiaTeslaT4
          - NvidiaL4

permissions:
  contents: read

jobs:
  run_from_manual_dispatch:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/kaggle-sentiment-pilot.yml
    with:
      kaggle_kernel_id: ${{ inputs.kaggle_kernel_id }}
      publish_qwen_adapter: ${{ inputs.publish_qwen_adapter }}
      hf_model_repo: ${{ inputs.hf_model_repo }}
      accelerator: ${{ inputs.accelerator }}
    secrets: inherit

  run_from_tagged_main_push:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[run-kaggle-training]') }}
    uses: ./.github/workflows/kaggle-sentiment-pilot.yml
    with:
      publish_qwen_adapter: true
      hf_model_repo: "hasankb00/dijital-ikiz-qwen3-4b-lora"
      accelerator: "NvidiaTeslaT4"
    secrets: inherit
