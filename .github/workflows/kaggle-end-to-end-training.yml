name: Kaggle End-to-End Model Training

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/kaggle-end-to-end-training.yml"
      - "dijital-ikiz-mvp/dijital-ikiz-mvp/ml/kaggle/dijital_ikiz_training.ipynb"
  workflow_dispatch:
    inputs:
      kaggle_kernel_id:
        description: "Kaggle notebook ID (owner/slug)"
        required: true
        type: string
        default: "asilkantkiye/dijital-ikiz-training"
      publish_qwen_adapter:
        description: "Publish the evaluated Qwen LoRA adapter to a private Hugging Face model repo"
        required: true
        type: boolean
        default: false
      hf_model_repo:
        description: "Hugging Face repo ID (owner/model-name); required only when publishing"
        required: false
        type: string
        default: "hasankb00/dijital-ikiz-qwen3-4b-lora-pilot"

permissions:
  contents: read

concurrency:
  group: kaggle-digital-twin-training
  cancel-in-progress: false

jobs:
  train:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-kaggle-training]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KULLANABILEGIN_TOKEN || secrets.KAGGLE_KULLANABILECEGIN_TOKEN || secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate safe inputs and credentials
        env:
          INPUT_KERNEL_ID: ${{ inputs.kaggle_kernel_id || vars.KAGGLE_KERNEL_ID || 'asilkantkiye/dijital-ikiz-training' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_KERNEL_ID" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Kaggle notebook ID must have the form owner/slug."
            exit 1
          fi
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]] && { [[ -z "${KAGGLE_USERNAME:-}" ]] || [[ -z "${KAGGLE_KEY:-}" ]]; }; then
            echo "::error::Add KAGGLE_API_TOKEN (preferred) or KAGGLE_USERNAME + KAGGLE_KEY in GitHub Actions Secrets."
            exit 1
          fi
          echo "KERNEL_ID=$INPUT_KERNEL_ID" >> "$GITHUB_ENV"
          echo "Kaggle notebook ID and credential presence validated without displaying any secret."

      - name: Prepare Kaggle notebook metadata
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          kernel_id = os.environ["KERNEL_ID"]
          kernel_dir = Path("ml/kaggle")
          notebook = kernel_dir / "dijital_ikiz_training.ipynb"
          if not notebook.is_file():
              raise SystemExit(f"Training notebook missing: {notebook}")

          metadata = {
              "id": kernel_id,
              "title": "Dijital Ikiz Training",
              "code_file": notebook.name,
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          (kernel_dir / "kernel-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Prepared private Kaggle notebook metadata with GPU and Internet enabled.")
          PY

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade "kaggle>=2.2.4,<3"

      - name: Submit notebook and start Kaggle training
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
        run: |
          set -euo pipefail
          kaggle kernels push --path ml/kaggle --accelerator NvidiaTeslaT4 --timeout 14400

      - name: Wait for Kaggle training
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=240
          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            status_output="$(kaggle kernels status "$KERNEL_ID" 2>&1)"
            status_code=$?
            set -e
            normalized="$(printf '%s' "$status_output" | tr '[:upper:]' '[:lower:]')"

            if [[ "$normalized" == *"kernelworkerstatus.complete"* ]] || [[ "$normalized" =~ (^|[^a-z])complete([^a-z]|$) ]]; then
              echo "Kaggle reported successful completion."
              exit 0
            fi
            if [[ "$normalized" == *"kernelworkerstatus.error"* || "$normalized" == *"failed"* || "$normalized" == *"cancelled"* || "$normalized" == *"canceled"* || "$normalized" == *"aborted"* ]]; then
              echo "::error::Kaggle training finished with a failure status."
              printf '%s\n' "$status_output"
              exit 1
            fi
            if [[ "$status_code" -ne 0 && "$attempt" -ge 5 ]]; then
              echo "::error::Kaggle status could not be read after repeated attempts."
              printf '%s\n' "$status_output"
              exit 1
            fi
            if (( attempt % 5 == 0 )); then
              echo "Kaggle training is still pending/running (check $attempt of $max_attempts)."
            fi
            sleep 60
          done
          echo "::error::Kaggle training did not finish within the 4-hour polling window."
          exit 1

      - name: Download and validate model artifacts
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kaggle-output/unpacked"
          kaggle kernels output "$KERNEL_ID" --path "$GITHUB_WORKSPACE/kaggle-output" --force
          archive="$GITHUB_WORKSPACE/kaggle-output/dijital-ikiz-model-artifacts.zip"
          if [[ ! -s "$archive" ]]; then
            echo "::error::The expected model archive was not returned by Kaggle."
            find "$GITHUB_WORKSPACE/kaggle-output" -maxdepth 2 -type f -printf '%P\n' || true
            exit 1
          fi
          unzip -t "$archive"
          unzip -q "$archive" -d "$GITHUB_WORKSPACE/kaggle-output/unpacked"
          python - <<'PY'
          import json
          import math
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "kaggle-output" / "unpacked"
          required_reports = {
              "sentiment/metrics.json": "sentiment",
              "qwen-lora/metrics.json": "qwen",
          }

          def reject_non_finite(value):
              raise ValueError(f"Non-standard non-finite JSON number: {value}")

          def read_json(path):
              return json.loads(
                  path.read_text(encoding="utf-8"),
                  parse_constant=reject_non_finite,
              )

          def finite_number(value, label, *, minimum=None, maximum=None):
              if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value):
                  raise SystemExit(f"{label} must be a finite number.")
              if minimum is not None and value < minimum:
                  raise SystemExit(f"{label} is below the allowed minimum.")
              if maximum is not None and value > maximum:
                  raise SystemExit(f"{label} is above the allowed maximum.")
              return float(value)

          summary = {}
          reports = sorted(root.rglob("metrics.json"))
          if not reports:
              raise SystemExit("No metrics.json files found; refusing to publish unvalidated artifacts.")

          by_relative_path = {str(path.relative_to(root)).replace("\\", "/"): path for path in reports}
          missing = sorted(set(required_reports) - set(by_relative_path))
          if missing:
              raise SystemExit("Missing required trained-task metrics: " + ", ".join(missing))

          for relative_path, path in by_relative_path.items():
              try:
                  report = read_json(path)
              except Exception as exc:
                  raise SystemExit(f"Invalid metrics JSON: {relative_path}") from exc
              if not isinstance(report, dict):
                  raise SystemExit(f"Metrics root must be an object: {relative_path}")
              summary[relative_path] = report

          sentiment = summary["sentiment/metrics.json"]
          sentiment_metrics = sentiment.get("test_metrics")
          if not isinstance(sentiment_metrics, dict):
              raise SystemExit("Sentiment test_metrics object missing.")
          if "sentiment" not in str(sentiment.get("task", "")).casefold():
              raise SystemExit("Sentiment report task identity is incorrect.")
          if sentiment.get("model") != "dbmdz/bert-base-turkish-cased":
              raise SystemExit("Unexpected sentiment base model.")
          for key in ("accuracy", "f1_macro", "f1_weighted"):
              finite_number(sentiment_metrics.get(key), "sentiment.test_metrics." + key, minimum=0, maximum=1)
          for key in ("train_rows", "validation_rows", "test_rows"):
              rows = sentiment.get(key)
              if isinstance(rows, bool) or not isinstance(rows, int) or rows < 30:
                  raise SystemExit(f"Sentiment {key} is missing or too small.")
          for key in ("train_source_sha256", "test_source_sha256"):
              if not isinstance(sentiment.get(key), str) or not re.fullmatch(r"[0-9a-f]{64}", sentiment[key]):
                  raise SystemExit(f"Sentiment {key} must be a SHA-256 digest.")
          sentiment_model = root / "sentiment" / "model"
          if not (sentiment_model / "config.json").is_file() or not any(sentiment_model.glob("*.safetensors")):
              raise SystemExit("Trained sentiment model config/weights are missing.")
          if not (sentiment_model / "tokenizer.json").is_file() and not (sentiment_model / "tokenizer_config.json").is_file():
              raise SystemExit("Sentiment tokenizer files are missing.")

          qwen = summary["qwen-lora/metrics.json"]
          if qwen.get("task") != "Turkish instruction SFT with QLoRA":
              raise SystemExit("Qwen report task identity is incorrect.")
          if qwen.get("base_model") != "Qwen/Qwen3-4B-Instruct-2507":
              raise SystemExit("Unexpected Qwen base model.")
          for key in ("train_rows_encoded", "validation_rows_encoded", "test_rows_encoded"):
              rows = qwen.get(key)
              if isinstance(rows, bool) or not isinstance(rows, int) or rows <= 0:
                  raise SystemExit(f"Qwen {key} is missing or invalid.")
          base_loss = finite_number(qwen.get("base_model_test_loss"), "qwen.base_model_test_loss", minimum=0)
          tuned_loss = finite_number(qwen.get("finetuned_model_test_loss"), "qwen.finetuned_model_test_loss", minimum=0)
          finite_number(qwen.get("validation_loss"), "qwen.validation_loss", minimum=0)
          improvement = finite_number(qwen.get("test_loss_improvement"), "qwen.test_loss_improvement")
          if not math.isclose(improvement, base_loss - tuned_loss, rel_tol=1e-5, abs_tol=1e-6):
              raise SystemExit("Qwen test_loss_improvement does not match base minus fine-tuned test loss.")
          adapter_dir = root / "qwen-lora" / "adapter"
          if not (adapter_dir / "adapter_config.json").is_file() or not any(adapter_dir.glob("adapter_model.*")):
              raise SystemExit("Qwen adapter config/weight files are missing.")
          tokenizer_dir = root / "qwen-lora" / "tokenizer"
          if not (tokenizer_dir / "tokenizer_config.json").is_file():
              raise SystemExit("Qwen tokenizer config is missing.")

          output = root.parent / "metrics-summary.json"
          output.write_text(json.dumps(summary, ensure_ascii=False, indent=2, allow_nan=False) + "\n", encoding="utf-8")
          print(f"Validated {len(reports)} metrics report(s), both required trained tasks, finite values, SHA-256 provenance, and model weight files.")
          PY

      - name: Upload reproducible training artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kaggle-digital-twin-model-artifacts
          path: |
            kaggle-output/dijital-ikiz-model-artifacts.zip
            kaggle-output/metrics-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish Qwen LoRA adapter to Hugging Face
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_qwen_adapter) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-kaggle-training]')) }}
        env:
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          HF_MODEL_REPO: ${{ inputs.hf_model_repo || vars.HF_MODEL_REPO || 'hasankb00/dijital-ikiz-qwen3-4b-lora-pilot' }}
        working-directory: kaggle-output/unpacked
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_WRITE_TOKEN:-}" ]]; then
            echo "::warning::HF_WRITE_TOKEN is not configured. The validated Kaggle artifact remains uploaded, but Hugging Face publication is skipped."
            echo "publication=skipped-no-write-token" >> "$GITHUB_OUTPUT"
            {
              echo "### Hugging Face publication"
              echo ""
              echo "Skipped: `HF_WRITE_TOKEN` is missing. Training artifacts and metrics were preserved, but no model weights were published."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$HF_MODEL_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Provide a valid Hugging Face repo ID in owner/model-name format."
            exit 1
          fi
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import textwrap
          from pathlib import Path
          from huggingface_hub import HfApi

          root = Path.cwd()
          source_adapter = root / "qwen-lora" / "adapter"
          source_tokenizer = root / "qwen-lora" / "tokenizer"
          metrics_path = root / "qwen-lora" / "metrics.json"
          repo_id = os.environ["HF_MODEL_REPO"].strip()
          token = os.environ["HF_WRITE_TOKEN"]

          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo_id):
              raise SystemExit("Invalid Hugging Face model repo ID.")
          if not (source_adapter / "adapter_config.json").is_file():
              raise SystemExit("Qwen LoRA adapter_config.json is missing; no model will be published.")
          if not any(source_adapter.glob("adapter_model.*")):
              raise SystemExit("Qwen LoRA weights are missing; no model will be published.")
          if not metrics_path.is_file():
              raise SystemExit("Qwen metrics.json is missing; no model will be published.")

          release_dir = root / "qwen-lora-release"
          release_dir.mkdir(parents=True, exist_ok=True)
          for source in source_adapter.iterdir():
              target = release_dir / source.name
              if source.is_dir():
                  shutil.copytree(source, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(source, target)
          if source_tokenizer.is_dir():
              for source in source_tokenizer.iterdir():
                  target = release_dir / source.name
                  if source.is_dir():
                      shutil.copytree(source, target, dirs_exist_ok=True)
                  else:
                      shutil.copy2(source, target)
          shutil.copy2(metrics_path, release_dir / "training-metrics.json")

          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
          readme = textwrap.dedent(f"""
          ---
          base_model: {metrics.get('base_model', 'Qwen/Qwen3-4B-Instruct-2507')}
          library_name: peft
          pipeline_tag: text-generation
          tags:
          - qwen3
          - lora
          - turkish
          - kaggle
          ---

          # Dijital İkiz İnsan — Qwen3-4B LoRA pilot

          This repository contains a **LoRA adapter**, not a standalone full model.
          Base model: {metrics.get('base_model', 'Qwen/Qwen3-4B-Instruct-2507')}.

          Training dataset: {metrics.get('dataset', 'TFLai/Turkish-Alpaca')} at revision {metrics.get('dataset_revision', '90f9589')}.

          The attached training-metrics.json records the actual run's training/test losses and sample counts. The model was trained on general Turkish instruction examples; it was **not** trained on a user's private chat history and does not represent a validated emotion or Big Five predictor.

          This artifact is published privately by default. Review the dataset and base-model license terms, the metrics, and the adapter before making it public. Test loss alone does not establish chat quality or the project's claimed research target.

          To load the adapter, use the compatible base model with the PEFT library and follow the base model's license and usage requirements.
          """).lstrip()
          (release_dir / "README.md").write_text(readme, encoding="utf-8")

          api = HfApi(token=token)
          api.create_repo(repo_id=repo_id, repo_type="model", private=True, exist_ok=True)
          repo_info = api.repo_info(repo_id=repo_id, repo_type="model")
          if not repo_info.private:
              raise SystemExit("Target Hugging Face repository is public; refusing to upload. Choose a private repository.")
          api.upload_folder(
              repo_id=repo_id,
              repo_type="model",
              folder_path=str(release_dir),
              commit_message="Publish evaluated Qwen3-4B LoRA pilot",
          )
          print(f"Published Qwen LoRA adapter to private Hugging Face repo: {repo_id}")
          PY
