name: Vercel Deploy

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Vercel secrets
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -n "$VERCEL_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel deployment preflight"
              echo ""
              echo "The VERCEL_TOKEN secret is present. Deployment will use the configured team scope help-70c6."
              echo ""
              echo "This preflight does not prove the deployment succeeded; check the deploy job result and production deployment after the run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Vercel token secret is available."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel deployment not run"
              echo ""
              echo "The deploy job was skipped because the required repository secret is missing:"
              echo ""
              echo "- VERCEL_TOKEN"
              echo ""
              echo "Add it in **GitHub repository Settings → Secrets and variables → Actions**. The team scope is configured as help-70c6; no separate organization ID secret is needed. Never put the token in source code, workflow logs, issues, or chat."
              echo ""
              echo "After saving the secret, open **Actions → Vercel Deploy → Run workflow**. A green preflight with a skipped deploy job does not mean production was updated."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::VERCEL_TOKEN GitHub Actions secret is missing. No production deployment was attempted."
            exit 1
          fi

  validate:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package.json

      - name: Set up Python for notebook validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile ML Python sources
        run: python -m compileall -q ml

      - name: Validate Kaggle notebook syntax
        run: python ml/kaggle/validate_notebook.py

      - name: Validate sentiment baseline notebook syntax
        run: python ml/kaggle/validate_notebook.py ml/kaggle/sentiment_baseline.ipynb

      - name: Validate ML dataset, splits, and leakage guardrails
        run: python -m unittest discover -s ml/tests -p "test_*.py"

      - name: Install
        run: npm install

      - name: Unit tests (memory and API validation)
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    needs: [preflight, validate]
    if: ${{ needs.preflight.outputs.ready == 'true' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package.json

      - name: Link existing Vercel project
        run: npx --yes vercel@latest link --yes --project dijital-ikiz-insan --scope "help-70c6" --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel production
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_output="$(npx --yes vercel@latest deploy --prod --yes --scope "help-70c6" --token "$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_output" | node tests/helpers/extract-vercel-deployment-url.mjs)"

          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel CLI did not return an expected deployment URL."
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Production deployment created"
            echo ""
            echo "- Deployment URL: $deployment_url"
            echo "- Next step: verify /api/health and required configuration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production health and chat configuration
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          health_response="$(npx --yes vercel@latest curl /api/health --deployment "$DEPLOYMENT_URL" --scope "help-70c6" --token "$VERCEL_TOKEN")"

          printf '%s' "$health_response" | node -e '
          let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            let health;
            try {
              health = JSON.parse(input);
            } catch {
              console.error("Health endpoint did not return valid JSON.");
              process.exit(1);
            }

            if (health.ok !== true) {
              console.error("Health endpoint did not confirm liveness.");
              process.exit(1);
            }

            if (health.ready !== true) {
              console.error(
                "App is live but chat configuration is incomplete:",
                JSON.stringify(health.configured ?? {})
              );
              process.exit(1);
            }

            console.log("Deployment smoke test passed: health is live and chat configuration is present.");
          });
          '

          {
            echo ""
            echo "## Production health smoke test passed"
            echo ""
            echo "- Endpoint /api/health returned valid JSON."
            echo "- The app confirmed liveness and minimum chat-provider configuration."
          } >> "$GITHUB_STEP_SUMMARY"
