name: Vercel Deploy

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check deployment prerequisites
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
          PRODUCTION_SMOKE_TEST_EMAIL: ${{ secrets.PRODUCTION_SMOKE_TEST_EMAIL }}
          PRODUCTION_SMOKE_TEST_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_TEST_PASSWORD }}
          SUPABASE_PRODUCTION_SCHEMA_VERIFIED: ${{ vars.SUPABASE_PRODUCTION_SCHEMA_VERIFIED }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          missing=()
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            missing+=("deployment must be dispatched from main (current ref: $WORKFLOW_REF)")
          fi
          if [[ -z "$VERCEL_TOKEN" ]]; then
            missing+=("VERCEL_TOKEN (GitHub Actions secret)")
          fi
          if [[ -z "$HF_TOKEN" ]]; then
            missing+=("HF_TOKEN (Hugging Face inference/read token in GitHub Actions Secrets)")
          fi
          if [[ ${#HEALTHCHECK_TOKEN} -lt 32 ]]; then
            missing+=("HEALTHCHECK_TOKEN (GitHub Actions secret, minimum 32 characters)")
          fi
          if [[ -z "$PRODUCTION_SMOKE_TEST_EMAIL" ]]; then
            missing+=("PRODUCTION_SMOKE_TEST_EMAIL (dedicated confirmed Supabase smoke-test account)")
          fi
          if [[ -z "$PRODUCTION_SMOKE_TEST_PASSWORD" ]]; then
            missing+=("PRODUCTION_SMOKE_TEST_PASSWORD (dedicated smoke-test account password)")
          fi
          if [[ "$SUPABASE_PRODUCTION_SCHEMA_VERIFIED" != "true" ]]; then
            missing+=("SUPABASE_PRODUCTION_SCHEMA_VERIFIED=true (repository variable)")
          fi

          if (( ${#missing[@]} == 0 )); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel deployment preflight"
              echo ""
              echo "Vercel access, upstream health secret, and database migration confirmation are present."
              echo ""
              echo "The migration confirmation is manual. CI cannot prove the live Supabase project was migrated; confirm the migration and function permissions in the intended project first."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Required deployment prerequisites are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel deployment not run"
              echo ""
              echo "The deploy job was blocked because these deployment prerequisites are missing:"
              echo ""
              for prerequisite in "${missing[@]}"; do
                echo "- $prerequisite"
              done
              echo ""
              echo "Add VERCEL_TOKEN in **Settings → Secrets and variables → Actions → New repository secret**."
              echo "Never put either token in source code, workflow logs, issues, or chat."
              echo ""
              echo "Add HEALTHCHECK_TOKEN as a GitHub Actions secret (at least 32 random characters) and configure the identical value as a Vercel Production environment variable. The post-deploy probe will fail closed if the values do not match."
              echo ""
              echo "Add PRODUCTION_SMOKE_TEST_EMAIL and PRODUCTION_SMOKE_TEST_PASSWORD for a dedicated, confirmed, low-privilege Supabase test user. The workflow runs an authenticated baseline chat request and expects HTTP 200; it also verifies anonymous chat is rejected with HTTP 401. These credentials are GitHub Actions secrets only and are never written to Vercel or logs."
              echo ""
              echo "Set repository variable **SUPABASE_PRODUCTION_SCHEMA_VERIFIED** to exactly **true** only after the baseline schema and all required migrations are applied to the intended Supabase project, and RLS policies plus required RPC permissions/functions are verified. Follow supabase/MIGRATION_RUNBOOK.md."
              echo ""
              echo "If Supabase is inactive or the migration cannot be verified, leave the variable unset. CI passing does not prove production database readiness."
              echo ""
              echo "After both prerequisites are verified, open **Actions → Vercel Deploy → Run workflow**. Missing prerequisites mean no production deployment was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployment prerequisites are missing. See the workflow summary; no production deployment was attempted."
            exit 1
          fi

  validate:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package-lock.json

      - name: Set up Python for notebook validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile ML Python sources
        run: python -m compileall -q ml

      - name: Validate Kaggle notebook syntax
        run: python ml/kaggle/validate_notebook.py

      - name: Validate sentiment baseline notebook syntax
        run: python ml/kaggle/validate_notebook.py ml/kaggle/sentiment_baseline.ipynb

      - name: Validate ML dataset, splits, and leakage guardrails
        run: python -m unittest discover -s ml/tests -p "test_*.py"

      - name: Install
        run: npm ci

      - name: Unit tests (memory and API validation)
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  stage:
    needs: [preflight, validate]
    if: ${{ github.ref == 'refs/heads/main' && needs.preflight.outputs.ready == 'true' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deployment.outputs.url }}
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package-lock.json

      - name: Link existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@63.1.2 link --yes --project dijital-ikiz-insan --scope "help-70c6"

      - name: Provision missing server-only Production secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/vercel-production-env.txt"
          if ! npx --yes vercel@63.1.2 env ls production --scope "help-70c6" > "$env_file" 2>&1; then
            echo "::error::Could not inspect Production environment variable names; no secret was changed."
            exit 1
          fi

          provision_if_missing() {
            local key="$1"
            local value="$2"
            local minimum_length="$3"

            if grep -Fq -- "$key" "$env_file"; then
              echo "$key already exists in Production; preserving the stored value."
              return 0
            fi
            if [[ -z "$value" || ${#value} -lt "$minimum_length" ]]; then
              echo "::error::$key is missing from Production and its matching GitHub Actions secret is absent or too short."
              exit 1
            fi

            # Keep values on stdin, suppress CLI output, and never print secret contents.
            if ! printf '%s' "$value" | npx --yes vercel@63.1.2 env add "$key" production --scope "help-70c6" --sensitive --force >/dev/null 2>&1; then
              echo "::error::Could not provision $key in Production."
              exit 1
            fi
            if ! npx --yes vercel@63.1.2 env ls production --scope "help-70c6" > "$env_file" 2>&1 || ! grep -Fq -- "$key" "$env_file"; then
              echo "::error::$key was not present after provisioning."
              exit 1
            fi
            echo "Provisioned missing Production secret: $key (value redacted)."
          }

          provision_if_missing "HF_TOKEN" "$HF_TOKEN" 20
          provision_if_missing "HEALTHCHECK_TOKEN" "$HEALTHCHECK_TOKEN" 32

      - name: Verify required Production environment variable names
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/vercel-production-env.txt"
          if ! npx --yes vercel@63.1.2 env ls production --scope "help-70c6" > "$env_file" 2>&1; then
            echo "::error::Could not inspect Vercel Production environment variable names; deployment blocked."
            exit 1
          fi

          missing=()
          for key in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY \
            HF_TOKEN \
            RATE_LIMIT_KEY_SALT \
            HEALTHCHECK_TOKEN \
            UPSTASH_REDIS_REST_URL \
            UPSTASH_REDIS_REST_TOKEN; do
            if ! grep -Fq -- "$key" "$env_file"; then
              missing+=("$key")
            fi
          done


          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required Vercel Production variable names: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "Required Production variable names are present; values were not printed."

      - name: Pull Vercel Production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@63.1.2 pull --yes --environment=production --scope "help-70c6"

      - name: Verify actual Production environment values before build
        shell: bash
        run: node scripts/check-production-env.mjs .vercel/.env.production.local

      - name: Build the Production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@63.1.2 build --prod --scope "help-70c6"

      - name: Deploy to Vercel production
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_output="$(npx --yes vercel@63.1.2 deploy --prebuilt --prod --skip-domain --yes --scope "help-70c6")"
          deployment_url="$(printf '%s\n' "$deployment_output" | node tests/helpers/extract-vercel-deployment-url.mjs)"

          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel CLI did not return an expected deployment URL."
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Staged production deployment created"
            echo ""
            echo "- Deployment URL: $deployment_url"
            echo "- Production domain assignment was skipped."
            echo "- Promotion runs only after configuration and upstream health checks pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production health and chat configuration
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          health_response="$(npx --yes vercel@63.1.2 curl /api/health --deployment "$DEPLOYMENT_URL" --scope "help-70c6")"

          printf '%s' "$health_response" | node -e '
          let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            let health;
            try {
              health = JSON.parse(input);
            } catch {
              console.error("Health endpoint did not return valid JSON.");
              process.exit(1);
            }

            if (health.ok !== true) {
              console.error("Health endpoint did not confirm liveness.");
              process.exit(1);
            }

            if (health.ready !== true) {
              console.error(
                "App is live but chat configuration is incomplete:",
                JSON.stringify(health.configured ?? {})
              );
              process.exit(1);
            }

            console.log("Deployment smoke test passed: health is live and chat configuration is present.");
          });
          '

          {
            echo ""
            echo "## Staged production health smoke test passed"
            echo ""
            echo "- Endpoint /api/health returned valid JSON."
            echo "- The app confirmed liveness and minimum chat-provider configuration."
            echo "- This deployment has not been assigned the production domain."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Verify production upstream connectivity
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          header_file="$(mktemp)"
          trap 'rm -f "$header_file"' EXIT
          printf 'x-healthcheck-token: %s\n' "$HEALTHCHECK_TOKEN" > "$header_file"

          probe_response="$(npx --yes vercel@63.1.2 curl /api/health/deep --deployment "$DEPLOYMENT_URL" --scope "help-70c6" -H "@$header_file")"

          printf '%s' "$probe_response" | node -e '
          let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            let result;
            try {
              result = JSON.parse(input);
            } catch {
              console.error("Deep health endpoint did not return valid JSON.");
              process.exit(1);
            }

            if (
              result.ok !== true ||
              result.providers?.supabase !== true ||
              result.providers?.huggingface !== true ||
              result.providers?.rateLimit !== true
            ) {
              console.error("Upstream connectivity probe failed; provider checks did not all pass.");
              process.exit(1);
            }

            console.log("Deep health passed for Supabase Auth, Hugging Face token authentication, and Upstash Redis REST PING.");
          });
          '

          {
            echo ""
            echo "## Staged upstream connectivity passed"
            echo ""
            echo "- Supabase Auth HTTP probe passed."
            echo "- Hugging Face token authentication passed; this probe does not perform model inference."
            echo "- The configured Upstash Redis REST limiter passed its live PING probe."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run authenticated smoke tests on the staged production artifact
        env:
          BASE_URL: ${{ steps.deployment.outputs.url }}
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
          PRODUCTION_SMOKE_TEST_EMAIL: ${{ secrets.PRODUCTION_SMOKE_TEST_EMAIL }}
          PRODUCTION_SMOKE_TEST_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_TEST_PASSWORD }}
          VERCEL_ENV_FILE: .vercel/.env.production.local
        run: node tests/production-smoke.mjs

  promote:
    needs: [preflight, validate, stage]
    if: ${{ github.ref == 'refs/heads/main' && needs.preflight.outputs.ready == 'true' && needs.validate.result == 'success' && needs.stage.result == 'success' }}
    runs-on: ubuntu-latest
    # Configure required reviewers in Settings -> Environments -> production.
    # This approval is reached only after the staged deployment passes both health gates.
    environment: production
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package-lock.json


      - name: Promote verified staged deployment
        env:
          DEPLOYMENT_URL: ${{ needs.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@63.1.2 promote "$DEPLOYMENT_URL" --yes --scope "help-70c6"

      - name: Link Vercel project for live production smoke test
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@63.1.2 link --yes --project dijital-ikiz-insan --scope "help-70c6"

      - name: Pull Production environment for the authenticated smoke test
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@63.1.2 pull --yes --environment=production --scope "help-70c6"

      - name: Verify production chat and upstreams through the public domain
        env:
          BASE_URL: https://dijital-ikiz-insan.vercel.app
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
          PRODUCTION_SMOKE_TEST_EMAIL: ${{ secrets.PRODUCTION_SMOKE_TEST_EMAIL }}
          PRODUCTION_SMOKE_TEST_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_TEST_PASSWORD }}
          VERCEL_ENV_FILE: .vercel/.env.production.local
        run: node tests/production-smoke.mjs

      - name: Verify health through the production domain
        shell: bash
        run: |
          set -euo pipefail
          health_response="$(curl --fail --silent --show-error --max-time 20 https://dijital-ikiz-insan.vercel.app/api/health)"
          printf '%s' "$health_response" | node -e '
          let input = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", chunk => input += chunk);
          process.stdin.on("end", () => {
            let health;
            try { health = JSON.parse(input); }
            catch { console.error("Production alias health endpoint did not return valid JSON."); process.exit(1); }
            if (health.ok !== true || health.ready !== true) {
              console.error("Production alias is not ready; configuration status:", JSON.stringify(health.configured ?? {}));
              process.exit(1);
            }
            console.log("Production alias health/readiness check passed.");
          });
          '
          {
            echo ""
            echo "## Production alias health check passed"
            echo ""
            echo "- The public production domain returned ok=true and ready=true after promotion."
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Record deployment verification
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: [preflight, validate, stage, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Create sanitized release evidence
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PREFLIGHT_READY: ${{ needs.preflight.outputs.ready }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          STAGE_RESULT: ${{ needs.stage.result }}
          PROMOTION_RESULT: ${{ needs.promote.result }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const report = {
            workflow: 'Vercel Deploy',
            run_id: Number(process.env.RELEASE_RUN_ID),
            run_url: process.env.RELEASE_RUN_URL,
            commit: process.env.RELEASE_SHA,
            preflight: {
              result: process.env.PREFLIGHT_RESULT,
              ready: process.env.PREFLIGHT_READY || null
            },
            validation: process.env.VALIDATION_RESULT,
            staged_deployment: process.env.STAGE_RESULT,
            production_promotion_and_health: process.env.PROMOTION_RESULT,
            secrets_included: false
          };
          report.conclusion = [
            report.preflight.result,
            report.validation,
            report.staged_deployment,
            report.production_promotion_and_health
          ].every(value => value === 'success') && report.preflight.ready === 'true'
            ? 'success'
            : 'blocked_or_failed';
          fs.mkdirSync(process.env.RUNNER_TEMP + '/vercel-release-report', {recursive: true});
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/vercel-release-report/status.json',
            JSON.stringify(report, null, 2) + '\n'
          );
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Publish evidence to the release-status branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C ops/vercel-deployment-results origin/main
          mkdir -p .github/status
          cp "$RUNNER_TEMP/vercel-release-report/status.json" .github/status/vercel-deployment-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/vercel-deployment-status.json
          if git diff --cached --quiet; then
            echo "Release evidence is unchanged."
            exit 0
          fi
          git commit -m "chore(ops): record Vercel release verification"
          git push --force origin HEAD:ops/vercel-deployment-results
