name: Vercel Deploy

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Vercel secrets
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -n "$VERCEL_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel deployment preflight"
              echo ""
              echo "The VERCEL_TOKEN secret is present. Deployment will use the configured team scope help-70c6."
              echo ""
              echo "This preflight does not prove the deployment succeeded; check the deploy job result and production deployment after the run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Vercel token secret is available."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel deployment not run"
              echo ""
              echo "The deploy job was skipped because the required repository secret is missing:"
              echo ""
              echo "- VERCEL_TOKEN"
              echo ""
              echo "Add it in **GitHub repository Settings → Secrets and variables → Actions**. The team scope is configured as help-70c6; no separate organization ID secret is needed. Never put the token in source code, workflow logs, issues, or chat."
              echo ""
              echo "After saving the secret, open **Actions → Vercel Deploy → Run workflow**. A green preflight with a skipped deploy job does not mean production was updated."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::VERCEL_TOKEN GitHub Actions secret is missing. Deployment will be skipped."
          fi

  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package.json

      - name: Link existing Vercel project
        run: npx --yes vercel@latest link --yes --project dijital-ikiz-insan --scope "help-70c6" --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel production
        run: npx --yes vercel@latest deploy --prod --yes --scope "help-70c6" --token "${{ secrets.VERCEL_TOKEN }}"
