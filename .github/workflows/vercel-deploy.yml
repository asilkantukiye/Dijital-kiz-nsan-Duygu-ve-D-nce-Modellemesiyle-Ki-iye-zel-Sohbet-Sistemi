name: Vercel Deploy

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Vercel secrets
        id: check
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel deployment preflight"
              echo ""
              echo "Required GitHub Actions secrets were detected. The deploy job will attempt production deployment."
              echo ""
              echo "This preflight does not prove the deployment succeeded; check the deploy job result and production deployment after the run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Vercel deployment secrets are available."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Vercel deployment not run"
              echo ""
              echo "The deploy job was skipped because one or both required repository secrets are missing:"
              echo ""
              echo "- VERCEL_TOKEN"
              echo "- VERCEL_ORG_ID"
              echo ""
              echo "Add the values in **GitHub repository Settings → Secrets and variables → Actions**. Never put the token in source code, workflow logs, issues, or chat."
              echo ""
              echo "After saving the secrets, open **Actions → Vercel Deploy → Run workflow**. A green preflight with a skipped deploy job does not mean production was updated."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::VERCEL_TOKEN ve/veya VERCEL_ORG_ID GitHub Secrets içinde yok. Deployment atlanacak."
          fi

  deploy:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dijital-ikiz-mvp/dijital-ikiz-mvp/package.json

      - name: Link existing Vercel project
        run: npx --yes vercel@latest link --yes --project dijital-ikiz-insan --scope "${{ secrets.VERCEL_ORG_ID }}" --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel production
        run: npx --yes vercel@latest deploy --prod --yes --scope "${{ secrets.VERCEL_ORG_ID }}" --token "${{ secrets.VERCEL_TOKEN }}"
