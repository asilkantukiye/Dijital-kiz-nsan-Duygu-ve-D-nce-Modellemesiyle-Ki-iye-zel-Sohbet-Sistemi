name: Generate dependency lockfile (temporary)

on:
  push:
    branches: ["fix/reproducible-dependencies-ci"]
    paths:
      - ".github/workflows/generate-package-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dijital-ikiz-mvp/dijital-ikiz-mvp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reproducible-dependencies-ci
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate lockfile from declared dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:fix/reproducible-dependencies-ci
